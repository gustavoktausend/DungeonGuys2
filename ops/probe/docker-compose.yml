# ops/probe/docker-compose.yml — DISPOSABLE SCAFFOLDING, WITH A DEATH DATE.
#
# Plan 02-14 DELETES this file in the same commit that creates the real
# ops/docker-compose.yml. If you are reading it after that commit landed,
# something went wrong: it has no job left.
#
# It lives in ops/probe/ rather than in ops/ on purpose. The glob of
# tests/ops-config.test.ts is `../ops/*`, which does not descend into a
# subdirectory, so this file is deliberately OUTSIDE the suite that rules over
# ops/. That is the correct place for scaffolding: the assertions of that suite
# are promises about files the box executes forever, and this one is a promise
# about an afternoon.
#
# WHAT IT EXISTS TO PROVE — assumption A1 of the phase research, and nothing
# else: that Coolify accepts a TWO-SERVICE composition read from a public
# repository (resource type Application, source Public Repository, build pack
# Docker Compose), discovers both services, and lets the domain be attached to
# the one that declares a port. The answer changes the shape of plan 02-14 —
# a composition pasted into the panel instead of read from git (at the cost of
# D2-15 for that file), or one container with s6-overlay instead of two. Finding
# that out BEFORE the Dockerfiles and ~10 new assertions exist costs half.
#
# Second thing it buys, and it is not a side effect: the FIRST valid
# Let's Encrypt certificate for the game's hostname, issued by the Coolify
# Traefik. Until it exists the hostname answers 503 with a self-signed
# certificate from the catchall router (measured, research DM-18), and that is
# the unfinished half of INFRA-01.
#
# ONE OFFICIAL IMAGE, PINNED TO AN EXACT PATCH TAG, never `latest` (C-6, T-2-SC).
# No `command` override either: the official image already serves a welcome page
# on port 80, and using the default behaviour is what makes this proof depend on
# nothing I cannot verify from here.
#
# WHAT IS ABSENT, AND WHY EACH ABSENCE IS A DECISION
#
#   No `networks` key. Coolify creates an isolated bridge and its own
#   documentation warns that declaring one here causes intermittent route loss
#   in Traefik.
#
#   Nothing published on the host (D2-22). The collision with the Traefik panel,
#   which already holds 0.0.0.0:8080, disappears by construction — and a
#   container port without publication crosses neither the UFW nor the NAT
#   (research DM-15).
#
#   No build step (D2-23). The integrator builds; the box pulls. It is also what
#   makes the first deploy's log say `pull` — confirm that it does, because a
#   build injected by the platform over a composition that declares none would
#   be a no-op today and construction on a 2-vCPU box tomorrow (C-7).
#
# THE ONE THING THIS PROOF DOES NOT EXERCISE, said out loud: the real
# composition's internal port is 8080, not 80. The number changes; the mechanism
# — `expose` is where Coolify reads the port for the Traefik label — does not.
services:
  # The service that holds the hostname. `expose` declares the container port
  # without publishing it, and it is the single value Coolify turns into the
  # Traefik router's port label.
  web:
    image: caddy:2.11.4-alpine
    expose: ['80']
    restart: unless-stopped

  # The second service exists ONLY to make the composition plural. Two services
  # is the whole assumption: one would prove nothing that a single-container
  # build pack does not already prove. It declares no reachable port, which is
  # also what the real `api` will look like from outside the bridge.
  api:
    image: caddy:2.11.4-alpine
    restart: unless-stopped
