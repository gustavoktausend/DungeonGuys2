# ops/turnserver.conf — copied to /etc/turnserver.conf, root:root, chmod 0600.
#
# The relay half of "the room closes behind Brazilian residential NAT"
# (SALA-04). Nothing here runs on a developer machine: it is configuration a
# VPS executes after the box of plan 02-04 exists. That is precisely why it
# carries a test — the failure mode of infra config is being wrong for months
# and nobody finding out until the night it matters. tests/ops-config.test.ts
# is the executable half of this file.
#
# THE SECRET BELOW IS A PLACEHOLDER AND HAS TO STAY ONE (D2-15). The real value
# exists only on the box — and it exists TWICE, in this file and in
# /etc/dg2/env. ops/README.md §12 spells out why that pair is the trap that
# costs a night of debugging.
#
# WHY 443 IS NOT IN THIS FILE. Port 443 belongs to Caddy, which serves the game
# and proxies /api and /ws. coturn takes 3478 (UDP and TCP) and 5349 (TLS),
# which covers essentially every home NAT and firewall. TURN over TLS on 443 is
# only needed behind a corporate firewall that opens nothing else, and that is
# REGISTERED DEBT, NOT BUILT: the two ways out, if it ever arrives, are Caddy's
# layer4 app routing by ALPN/SNI, or a second IP on the VPS. The header of
# ops/Caddyfile carries the same decision, because whoever reads one of the two
# files should not have to find the other to know the ports were decided.

# --- Listeners -------------------------------------------------------------
listening-port=3478
# DECLARED, NOT SERVED YET. A TLS listener only completes a handshake with
# `cert=` and `pkey=` naming a valid certificate for the realm, and the step
# that provides them is not in ops/README.md §12 yet: the box's certificate is
# renewed by Caddy inside its own data directory, which the coturn user does
# not read, and copying it out on every renewal is an operational decision that
# has not been taken. Until it is, the signalling server does NOT advertise a
# `turns:` URL (apps/server/src/signaling/turn.ts), so no browser is sent to a
# port that would refuse it. The port stays declared, and open in the firewall,
# so that the day the certificate step lands is two lines here and one there.
tls-listening-port=5349

# The realm is a placeholder, like every address in this repository (D2-15):
# nothing versioned says where the machine lives. Substitute it on the box.
realm=SEU_DOMINIO

# Makes coturn stamp the FINGERPRINT attribute on its STUN messages, which is
# what lets a peer tell TURN traffic from whatever else is multiplexed on the
# same port. WebRTC clients expect it.
fingerprint

# --- Ephemeral credentials, never a fixed user table -----------------------
#
# TURN REST API (draft-uberti-behave-turn-rest-00): the client NEVER receives
# the secret below. It asks the authenticated API for a pair, and gets back a
# username of the form "<expiry>:<userId>" plus an HMAC-SHA1 credential that
# stops working in one hour (D3-10). A fixed username/password in this file
# would be a relay anybody can use forever the first time one leaks (T-3-03).
use-auth-secret

# PLACEHOLDER — replace on the box, never here. The same string has to be in
# /etc/dg2/env as DG2_TURN_SECRET, because the Node side computes the HMAC the
# relay verifies. Changing one without the other makes the relay reject every
# credential it is handed, and the symptom is "one specific friend never gets
# in", which is indistinguishable from bad NAT (T-3-11). Both files are
# root-only 0600.
static-auth-secret=SUBSTITUA_NA_CAIXA

# --- Non-negotiable: an open TURN is a spam relay and SSRF into your own LAN -
#
# A relay whose job is to forward UDP to an address the CLIENT chooses is, by
# construction, a request forger. Without the list below, anyone on the
# internet can hand this server a private address and have it deliver packets
# to the VPS's own neighbours — the API on loopback, the metadata service on
# link-local, whatever else shares the network (T-3-04).
#
# THE LIST IS COUNTED BY A TEST, NOT READ BY A HUMAN, because the real failure
# mode is not deleting the block: it is shipping TEN of the eleven lines. An
# incomplete deny-list makes no noise at all — the relay works, the game works,
# and one whole address family stays reachable.
#
# The eleven cover 0.0.0.0/8 (this network), RFC 1918 private space in its
# three blocks, loopback, link-local, the RFC 6598 shared address space of
# 100.64.0.0/10 (CGNAT — and what providers of virtual machines use for their
# internal networks, which is to say the VPS's own neighbours), IPv6 loopback,
# the IPv6 unique-local range of RFC 4193, IPv6 link-local (the pair of the
# v4 link-local line above), and IPv4-mapped IPv6 addresses — the v4 ranges
# above spelled in a form a v4-only rule may not recognise, depending on how
# the relay normalises them. IPv6 is not optional here: Brazilian residential
# access is past half IPv6, so a v4-only deny-list leaves the modern half of
# the traffic open.
no-multicast-peers
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=::1
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=::ffff:0.0.0.0-::ffff:255.255.255.255

# --- Abuse and capacity ceilings -------------------------------------------
#
# The quotas are the bandwidth half of the same problem. A relayed room of four
# costs about 246 KB/s in the worst case (three of three links relayed), so
# user-quota=12 is generous for one player and still bounds what a single
# authenticated account can allocate. total-quota=1200 is the machine ceiling:
# it is sizing as much as it is anti-abuse, and it is the number to revisit
# before the KVM 2 traffic budget is, not after (T-3-05).
user-quota=12
total-quota=1200

# coturn's management interface has historically been where its CVEs lived.
# Nothing in this deployment needs it: the server is configured by this file
# and restarted by systemd (T-3-27).
no-cli
