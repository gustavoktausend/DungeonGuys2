# ops/turnserver.conf — copied to /etc/turnserver.conf, root:root, chmod 0600.
#
# The relay half of "the room closes behind Brazilian residential NAT"
# (SALA-04). Nothing here runs on a developer machine: it is configuration a
# VPS executes after the box of plan 02-04 exists. That is precisely why it
# carries a test — the failure mode of infra config is being wrong for months
# and nobody finding out until the night it matters. tests/ops-config.test.ts
# is the executable half of this file.
#
# THE SECRET BELOW IS A PLACEHOLDER AND HAS TO STAY ONE (D2-15). The real value
# exists only on the box — and it exists TWICE, in two places of DIFFERENT
# NATURES: this file, and the application's variables in the Coolify panel
# (D2-29, which amended D2-15 — the Node half of the pair stopped living in a
# file on the host and moved into a web panel's database). ops/README.md §12 and
# docs/OPERACAO.md spell out why that pair is the trap that costs a night of
# debugging: change one and the relay rejects every credential it is handed.
#
# THE DEFECT THIS FILE CARRIED UNTIL PLAN 02-04, AND IT IS THE MOST EXPENSIVE
# ONE OF PHASE 3 TO DIAGNOSE. Without min-port and max-port declared below,
# coturn allocates relay inside the ephemeral range 49152-65535 over UDP, the
# UFW `deny incoming` of the box blocks that range WHOLE, and what follows is
# the worst kind of failure: the relay authenticates, hands a perfectly valid
# address to the browser, and the traffic never arrives. The symptom is "ONE
# SPECIFIC FRIEND NEVER GETS IN", indistinguishable from bad NAT, and it is the
# very same symptom as the duplicated secret above. THE OTHER HALF OF THE FIX IS
# THE FIREWALL RULE, opened by Task 3 of plan 02-04 and recorded in
# docs/OPERACAO.md § Firewall do coturn. One without the other is worth nothing:
# a declared range nobody opened is still blocked, and an opened range nobody
# declared is still not where the relay allocates.
#
# WHY 443 IS NOT IN THIS FILE — AND THE LANDLORD CHANGED. The decision to give
# 3478 and 5349 to the relay survives whole; who owns 443 does not. On this box
# it is NOT Caddy's: it belongs to the Traefik of Coolify, shared with another
# project's live production (D-VPS-02), and the game's own Caddy now runs inside
# a container with no port published on the host at all (D2-22). coturn takes
# 3478 (UDP and TCP) and 5349 (TLS), which covers essentially every home NAT and
# firewall. TURN over TLS on 443 is only needed behind a corporate firewall that
# opens nothing else, and that is REGISTERED DEBT, NOT BUILT — and the debt got
# more expensive, because the way out is no longer ours to take alone: Caddy's
# layer4 routing by ALPN/SNI cannot reach a port its container does not hold, so
# what is left is a second address on the box or a Traefik configuration this
# project is not allowed to touch. The header of ops/Caddyfile carries the same
# decision, because whoever reads one of the two files should not have to find
# the other to know the ports were decided.

# --- Listeners -------------------------------------------------------------
listening-port=3478
# DECLARED, NOT SERVED YET. A TLS listener only completes a handshake with
# `cert=` and `pkey=` naming a valid certificate for the realm, and the step
# that provides them is not in ops/README.md §12 yet: the box's certificate is
# renewed by Caddy inside its own data directory, which the coturn user does
# not read, and copying it out on every renewal is an operational decision that
# has not been taken. Until it is, the signalling server does NOT advertise a
# `turns:` URL (apps/server/src/signaling/turn.ts), so no browser is sent to a
# port that would refuse it. The port stays declared, and open in the firewall,
# so that the day the certificate step lands is two lines here and one there.
tls-listening-port=5349

# ONE HUNDRED PORTS, AND THE NUMBER IS SIZING RATHER THAN TASTE (D2-27, C-5).
# Every TURN allocation consumes one port of this range for as long as it lives,
# and a room of four played entirely through the relay costs three allocations —
# so a hundred ports is roughly twenty-five fully relayed rooms at once, which
# is orders of magnitude above the closed circle of friends this game opens with.
#
# The range is DECLARED rather than left to coturn's default precisely so that it
# can be OPENED: these two lines and the firewall rule are ONE fix living in two
# places, and the header of this file says what happens when only one of them
# lands. Keeping it small matters for the same reason the deny-list below exists:
# opening 49152-65535 over UDP would hand the internet half of the host's own
# ephemeral space, which is where every outbound connection of the box draws its
# source port.
min-port=49200
max-port=49299

# The realm is a placeholder, like every address in this repository (D2-15):
# nothing versioned says where the machine lives. Substitute it on the box.
realm=SEU_DOMINIO

# Makes coturn stamp the FINGERPRINT attribute on its STUN messages, which is
# what lets a peer tell TURN traffic from whatever else is multiplexed on the
# same port. WebRTC clients expect it.
fingerprint

# --- Ephemeral credentials, never a fixed user table -----------------------
#
# TURN REST API (draft-uberti-behave-turn-rest-00): the client NEVER receives
# the secret below. It asks the authenticated API for a pair, and gets back a
# username of the form "<expiry>:<tag>" plus an HMAC-SHA1 credential that
# stops working in one hour (D3-10). The tag is a keyed digest of the room and
# the seat, never the room code itself: this attribute travels in clear over
# UDP and TCP, and the code is the one credential a room has (T-3-03). A fixed
# username/password in this file would be a relay anybody can use forever the
# first time one leaks.
use-auth-secret

# PLACEHOLDER — replace on the box, never here. The same string has to be set
# as DG2_TURN_SECRET in the Coolify panel's app variables, because the Node
# side computes the HMAC this relay verifies.
#
# SAY IT OUT LOUD, because D2-29 made it worse than a duplicated value: the two
# copies live in places of DIFFERENT NATURES — this file, root-only 0600 on the
# host, and a web panel backed by Coolify's database. There is no single place
# to look and no diff that shows them out of step. The root-owned env file that
# used to hold the app's half is GONE — D2-29 retired it as the app's source of
# secrets, D2-30 retired the unit that read it, and the app no longer reads any
# file on this host.
#
# Changing one without the other makes the relay reject every credential it is
# handed, and the symptom is "one specific friend never gets in", which is
# indistinguishable from bad NAT (T-3-11).
static-auth-secret=SUBSTITUA_NA_CAIXA

# --- Non-negotiable: an open TURN is a spam relay and SSRF into your own LAN -
#
# A relay whose job is to forward UDP to an address the CLIENT chooses is, by
# construction, a request forger. Without the list below, anyone on the
# internet can hand this server a private address and have it deliver packets
# to the VPS's own neighbours — the API on loopback, the metadata service on
# link-local, whatever else shares the network (T-3-04).
#
# THE LIST IS COUNTED BY A TEST, NOT READ BY A HUMAN, because the real failure
# mode is not deleting the block: it is shipping TEN of the eleven lines. An
# incomplete deny-list makes no noise at all — the relay works, the game works,
# and one whole address family stays reachable.
#
# The eleven cover 0.0.0.0/8 (this network), RFC 1918 private space in its
# three blocks, loopback, link-local, the RFC 6598 shared address space of
# 100.64.0.0/10 (CGNAT — and what providers of virtual machines use for their
# internal networks, which is to say the VPS's own neighbours), IPv6 loopback,
# the IPv6 unique-local range of RFC 4193, IPv6 link-local (the pair of the
# v4 link-local line above), and IPv4-mapped IPv6 addresses — the v4 ranges
# above spelled in a form a v4-only rule may not recognise, depending on how
# the relay normalises them. IPv6 is not optional here: Brazilian residential
# access is past half IPv6, so a v4-only deny-list leaves the modern half of
# the traffic open.
no-multicast-peers
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=::1
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=::ffff:0.0.0.0-::ffff:255.255.255.255

# --- Abuse and capacity ceilings -------------------------------------------
#
# The quotas are the bandwidth half of the same problem, AND THEY ARE PINNED TO
# THE RELAY RANGE DECLARED ABOVE. total-quota may not exceed the number of ports
# that range delivers, because each allocation spends one of them. The old value
# of 1200 promised twelve times what a hundred-port range can hand out, which
# made it not a ceiling but a number that could never be reached: the real limit
# would have been "coturn ran out of ports", arriving as a failed allocation
# instead of as a quota, and a failed allocation is the same silent symptom this
# file's header is about. 100 is the machine ceiling and it is now exactly the
# size of the range — which is why tests/ops-config.test.ts computes the bound
# from max-port minus min-port instead of comparing against a copied constant. A
# future change to the range that forgets the quota has to fail loudly.
#
# user-quota drops from 12 to 6 for proportion, not for safety. A relayed room of
# four costs about 246 KB/s in the worst case (three of three links relayed);
# six allocations still bound what one authenticated account can take, while 12
# out of a total of 100 would let a single player hold an eighth of the machine
# (T-3-05). Both numbers are sizing as much as anti-abuse, and both are to be
# revisited before the traffic budget is, not after.
user-quota=6
total-quota=100

# coturn's management interface has historically been where its CVEs lived.
# Nothing in this deployment needs it: the server is configured by this file
# and restarted by systemd (T-3-27).
no-cli
