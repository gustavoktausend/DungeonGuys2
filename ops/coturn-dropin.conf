# ops/coturn-dropin.conf → /etc/systemd/system/coturn.service.d/dg2.conf
#
# A DROP-IN, AND THAT IS THE WHOLE POINT — it is the only file of ops/ that is
# not a copy. Until 2026-09-10 this repository also OWNED four whole units and
# installed them, because nothing else shipped them; D2-30 retired all four when
# the deployment became two containers, and the supervisor became Docker. This
# one survives because coturn is different: the Debian and Ubuntu package already
# installs coturn.service and already enables it, and has done since Buster and
# Disco — /etc/default/coturn with TURNSERVER_ENABLED=1 is documentation from
# an older era. Copying the distributor's unit here would mean adopting its
# maintenance, so the package's own security updates would stop reaching the
# box the day one of them touched a line we had frozen (T-3-SC).
#
# systemd merges this directory over the packaged unit, so the file only has to
# name what it changes. Everything not written here stays whatever the package
# decided, which is the property being bought.
#
# After copying it: systemctl daemon-reload. See ops/README.md §12.

[Service]
# The budget of ops/README.md §12, made real. D2-19 sized it against a 2 GB box;
# the real machine has ~8 GiB and shares them with another project's production,
# so the ceilings stopped being about scarcity and stayed obligatory for the
# ORIGINAL reason: the containers of the game cap themselves at a few hundred MiB
# of hard limit, and these ~128M are the relay's share — which up to now were
# only "held back for the phase-3 coturn" in a paragraph, with nothing enforcing
# it. MemoryHigh throttles and reclaims first; MemoryMax is the wall. They come
# as a pair so that pressure is felt before the kernel starts killing.
#
# BOTH ARE SILENTLY IGNORED UNDER CGROUP V1. The box is Debian 11+ / Ubuntu
# 22.04+, which is cgroup v2; ops/README.md §12 records why that matters, and it
# matters identically here.
#
# THE ABSENT NODE_OPTIONS LINE IS A DECISION, NOT AN OVERSIGHT. The `api` service
# of ops/docker-compose.yml pairs its memory ceiling with a V8 heap cap and says
# never to move one without the other — a pairing the retired unit carried first,
# and which a test still compares — because V8 sizes its old space from the MACHINE's
# memory rather than from the cgroup limit, and grows straight past the ceiling
# into an OOM kill. That trap belongs to V8. coturn is C: it sizes nothing from
# the machine's memory, so the cgroup limit is the only limit it needs, and
# there is no second number to keep in agreement.
MemoryHigh=96M
MemoryMax=128M

# The same hardening the retired server unit applied, now for the one process of
# this project that is still NATIVE on the host (D2-26) and that terminates
# attacker-chosen UDP for a living (T-3-28). The two containers get their
# isolation from the container runtime; coturn gets it from here, which is why
# this file outlived the units around it. NoNewPrivileges kills setuid
# escalation from inside; ProtectSystem=strict makes the whole filesystem
# read-only except what is explicitly granted; ProtectHome hides /home and
# /root; PrivateTmp gives it a /tmp nobody else can read.
#
# ProtectSystem=strict is the one that can break a start rather than fail
# quietly: coturn writes nothing outside /run and /var/log under this
# configuration, but that is a claim about THIS file — it stops being true the
# moment somebody adds a log or database directive to /etc/turnserver.conf, and
# the symptom is a clean-looking permission error at start. §12 says to read
# systemctl status for real, and this is what it is for.
NoNewPrivileges=true
ProtectSystem=strict
ProtectHome=true
PrivateTmp=true
