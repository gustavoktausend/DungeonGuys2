name: CI

on:
  pull_request:
  push:

# O PISO, e ele e do workflow inteiro (WR-19). Um `permissions:` dentro de um
# job governa aquele job e mais nada, entao `test` e `pwa` -- que nao
# declaravam nenhum -- herdavam o padrao do REPOSITORIO. Esse padrao concede
# ESCRITA em todos os escopos em qualquer repositorio ou organizacao criado
# antes da mudanca de 2023, e o repositorio deste projeto ainda nem existe: e
# desconhecido por construcao, o que e o mesmo que amplo. (A grafia literal
# desse valor nao aparece aqui de proposito: tests/workflows.test.ts a recusa
# como substring, sem isentar comentario, pelo mesmo motivo pelo qual recusa a
# descoberta de chave de host mais abaixo -- a hora em que alguem escreveria a
# linha e a hora em que um job esta vermelho e o caminho curto parece
# razoavel.) O resultado era o token largo justamente nos dois jobs que rodam a
# toolchain inteira e baixam tres motores de browser, e o token estreito no
# unico que nao faz checkout.
#
# `contents: read` e o que o CI de fato precisa: `actions/checkout` le a
# arvore, e nenhum passo escreve no repositorio. Os artefatos entre jobs sao do
# `actions/upload-artifact`, que usa um token proprio do runner e nao este.
#
# The `image` job keeps a block of its own on purpose, and it is not redundant
# with this one: a job-level `permissions:` REPLACES the workflow's instead of
# intersecting with it, so keeping it is what guarantees that raising this floor
# one day does not raise the ceiling of the only job that writes anything
# outside this repository. That job is also where the single `packages: write`
# of the whole file lives; its own comment says why an ephemeral job token is
# the cheap answer there.
permissions:
  contents: read

# As cinco acoes NAO estao todas no mesmo major, e isso e a correcao, nao
# desleixo. Ate aqui o arquivo inteiro dizia @v4 e o runner anotava toda
# execucao: "Node.js 20 is deprecated. The following actions target Node.js 20
# but are being forced to run on Node.js 24". Forcado nao e suportado -- quem
# publica a acao nunca exercitou as dependencias vendorizadas dela contra o 24
# -- entao a anotacao e o runner avisando que esta chutando por nos, dentro da
# esteira que publica a imagem.
#
# Cada acao atravessa para node24 num major diferente. O primeiro numero e
# aquele em que o `runs.using` do action.yml dela deixa de dizer node20; o
# segundo e onde este arquivo esta, que e o ultimo major publicado:
#
#   checkout           node24 a partir da v5    -> aqui na v7
#   setup-node         node24 a partir da v5    -> aqui na v7
#   cache              node24 a partir da v5    -> aqui na v6
#   upload-artifact    node24 a partir da v6    -> aqui na v7
#   download-artifact  node24 a partir da v7    -> aqui na v8
#
# A ARMADILHA, escrita porque nao da para adivinhar: subir tudo para a v5
# PARECE a correcao e deixa a anotacao exatamente onde estava. A v5 do
# upload-artifact e a v5 e a v6 do download-artifact ainda declaram node20 --
# sao node20 usando um numero mais novo. E esses dois sao justamente o par que
# leva os bytes publicaveis do job `test` ao job `image`, que e D2-05.
#
# Por que o ultimo major de cada, e nao o minimo que cala o aviso: em CI uma
# quebra e vermelha e imediata, ao contrario de um defeito de producao, e parar
# dois majors atras so reagenda este mesmo trabalho para daqui a pouco.
# tests/workflows.test.ts recusa qualquer major sabidamente node20, por tabela
# e sem rede -- entao o proximo a mexer aqui nao precisa confiar nesta lista.
#
# O que foi conferido nas notas de cada major atravessado, e nao presumido:
#
#   setup-node   a v5 ligou cache automatico e a v6 o limitou a npm. Nada disso
#                nos alcanca: ele so liga quando ha `packageManager` ou
#                `devEngines.packageManager` no package.json, e nao ha nenhum
#                dos dois. O `cache: npm` explicito abaixo continua sendo um
#                valor suportado na v7 (npm, yarn, pnpm), que e do que este
#                workflow depende.
#   cache        a semantica de chave e a MESMA na v6: chave ja existente nao e
#                regravada, so restaurada. E exatamente dela que depende o
#                sufixo `-chromium` da chave do job `pwa`, mais abaixo. A v6
#                acrescentou uma melhora que nao nos custa nada: quando o token
#                de cache e so de leitura, o passo de gravacao avisa em vez de
#                falhar o job.
#   checkout     a v6 passou a guardar a credencial num arquivo separado, e a
#                v7 passou a recusar checkout de PR de fork em
#                `pull_request_target` e `workflow_run`. Nenhum passo daqui usa
#                o token do checkout depois dele, e os gatilhos deste arquivo
#                sao `pull_request` e `push` -- os dois eventos citados nao
#                existem aqui.
#   artefatos    o par v7/v8 saiu no mesmo dia e e um par de proposito. A v7 do
#                upload ganhou envio de arquivo solto (`archive: false`), que
#                NAO usamos -- o padrao segue zipando, que e o que o job
#                `image` espera. A v8 do download deixou de tentar
#                descompactar tudo e passou a olhar o Content-Type antes, o que
#                casa com o zip que a v7 produz. A v8 tambem passou a ERRAR
#                quando o digest baixado nao bate com o do servidor, onde antes
#                so avisava: e o padrao certo para o unico job que empurra
#                bytes para fora deste repositorio. Baixar por `name:`, que e o
#                que fazemos, nao foi tocado pela quebra da v5 do download --
#                ela mudou o caminho de saida de quem baixa por
#                `artifact-ids:`.

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - run: npm ci
      - run: npm run lint
      # segunda guarda de pureza de packages/sim (D-16): lib sem DOM e types vazio,
      # entao o proprio compilador recusa window/document dentro do pacote
      - run: npm run typecheck:sim
      - run: npm run typecheck:protocol
      # apps/ NAO esta no include do tsconfig da raiz, entao o `tsc --noEmit` do
      # build nao ve uma linha de apps/server: sem este passo o servidor viajaria
      # ate a VPS sem nenhuma checagem de tipos. Ele tambem e o unico lugar onde
      # tests/server-migrate.test.ts e tests/server-health.test.ts sao compilados,
      # porque a raiz os exclui por precisarem de tipos de Node.
      - run: npm run typecheck:server
      # tests/net/room.spec.ts e tests/net/e2e-helpers.ts sao excluidos do
      # tsconfig da raiz porque precisam de tipos de Node (o helper abre um
      # http.Server e pendura o signaling nele). Sem este passo eles nao seriam
      # compilados por programa nenhum. tests/net/helpers.ts NAO esta aqui: ele
      # e puro e continua no programa da raiz, com os testes que o importam.
      - run: npm run typecheck:net
      - run: npm test

      # SYNC-04: imprime no log as tres partes do snapshot na wave 16 com quatro
      # jogadores e na wave 40 endless, e prova que cada uma cabe abaixo dos
      # 16 KiB por mensagem do DataChannel. O portao que QUEBRA o build ja e
      # tests/snapshot-bench.test.ts, uma linha acima; este passo existe para o
      # caso que o portao nao ve -- uma regressao de 2,8 KiB para 9 KiB passa no
      # teto e some na revisao. Rodando aqui, o tamanho novo fica no log do PR
      # que o causou, ao lado do diff que o causou.
      - run: npm run bench:snapshot

      # FORM-03: prova que o SIM_VERSION e reproduzivel (dois builds da mesma
      # fonte dao o mesmo valor) e sensivel (editar packages/sim/src muda o
      # valor). Roda aqui, e nao so no build final, para que a perda de
      # reprodutibilidade apareca no proprio PR que a causou -- tipicamente um
      # upgrade de Vite ou de TypeScript, que por D-07 fecha a temporada.
      - run: npm run sim:version:verify

      # FORM-09: a spec de assets so vale se a recusa for executavel. Os tres
      # passos rodam DEPOIS de sim:version:verify porque ele termina reconstruindo
      # packages/sim/dist/sim.js, que e de onde as hitboxes de ENEMY_DEFS sao
      # lidas -- o validador recusa a rodar sem ele.
      #   selftest  prova a aceitacao (fixtures/good, com o caso de hitbox maior
      #             que o sprite que so a tolerancia por entrada admite)
      #   refusal   prova que o manifesto quebrado NAO passa, e que a recusa
      #             aponta os tres defeitos por nome -- criterio de sucesso 5 da
      #             fase. Um portao que so testa aceitacao nao testa nada
      #   validate  roda contra public/assets, que e por onde a arte de verdade
      #             chega: PR de outro repositorio, sem revisao humana antes do
      #             CI (T-1-04). Hoje o diretorio nao tem manifesto e o passo e
      #             verde por vacuidade; ele existe para ja estar aqui no dia em
      #             que o primeiro lote chegar
      - run: npm run assets:selftest
      - run: npm run assets:refusal
      - run: npm run assets:validate

      # A versao exata do Playwright e a variavel do experimento de determinismo:
      # um cache compartilhado entre versoes diferentes invalida o portao.
      - id: playwright-version
        run: echo "version=$(node -p "require('./package-lock.json').packages['node_modules/playwright'].version")" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-ms-playwright-${{ steps.playwright-version.outputs.version }}

      - run: npx playwright install --with-deps chromium firefox webkit

      # FORM-04, criterio de sucesso 1 da fase: os quatro motores (Node, acima,
      # mais estes tres) tem de produzir o MESMO hashWorld na run de ouro.
      # Bloqueante desde o plano 01-12, que trocou a trigonometria do motor
      # pelo port fdlibm de sim/math.ts e virou este passo de vermelho para
      # verde. Se ele voltar a falhar, algum caminho de sim/ voltou a depender
      # de aritmetica que a spec so aproxima -- e o sintoma alternativo seria
      # uma sessao co-op dessincronizando na fase 4, onde diagnosticar custa
      # dez vezes mais.
      - run: npm run test:browser

      - run: npm run build

      # O portao do worker roda AQUI tambem, e nao so no job `pwa`, porque quem
      # sobe o artefato publicavel e este job: sem ele, o dist/ que viaja para a
      # caixa poderia ser um dist/ cujo sw.js ficou com as sentinelas de pe --
      # alguem rodou `vite build` solto -- e o service worker publicado
      # precacharia nada. E um defeito que so aparece offline, semanas depois,
      # e sem nada para correlacionar. O job `pwa` mantem o dele porque protege
      # outra coisa: o dist/ que as specs de Playwright servem.
      - run: npm run sw:verify

      # O bundle do servidor entra no mesmo par de artefatos para que cliente e
      # servidor publicados venham do MESMO commit e do MESMO job. O que faz os
      # dois lados do release chegarem juntos e a tag unica: as duas imagens sao
      # tagueadas pelo mesmo sha e `ops/docker-compose.yml` da uma
      # `DG2_IMAGE_TAG` so aos dois servicos, entao nao existe combinacao de
      # cliente e servidor de commits diferentes. (O script de release na caixa,
      # que comparava o sha256 deste arquivo para decidir se reiniciava a unit,
      # foi aposentado por D2-30 junto com a propria unit.)
      - run: npm run server:build

      # D2-05 escrito como bytes. O job de publicacao baixa EXATAMENTE estes
      # dois artefatos, entao o que chega na caixa e o que passou pelo portao
      # cross-engine (test:browser) e pelo portao do worker acima -- nunca um
      # segundo build que por acaso deu no mesmo. Reconstruir no outro job seria
      # mais barato de escrever e erraria justamente no dia em que o build
      # deixasse de ser reproduzivel, que e o dia em que ninguem esta olhando.
      # retention-days: 7 porque o artefato so precisa sobreviver ao job
      # seguinte, e reter menos e menos superficie.
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist
          retention-days: 7

      - uses: actions/upload-artifact@v7
        with:
          name: server
          path: dist-server
          retention-days: 7

  # A prova executavel de INFRA-02 e INFRA-03. Se este job ficar vermelho, uma
  # de tres coisas aconteceu: o precache deixou de cobrir o dist/, uma resposta
  # de /api/ passou a ser guardada em Cache Storage, ou a atualizacao a partir
  # de uma instalacao antiga parou de funcionar. Nenhuma das tres aparece em
  # outro portao, e nenhuma das tres da sintoma antes de um jogador abrir o jogo
  # sem rede -- semanas depois, sem nada para correlacionar.
  #
  # Independente do job `test` (sem `needs:`) porque os dois nao compartilham
  # artefato nenhum: serializar so somaria minutos ao PR. Quem declara
  # `needs:` nos dois portoes e o job `image`, mais abaixo, e e la que a
  # dependencia pertence -- publicar e o unico passo que precisa dos dois.
  pwa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      # O mesmo par de passos do job `test`, e pelo mesmo motivo: a versao exata
      # do Playwright e a variavel do experimento, entao um cache compartilhado
      # entre versoes diferentes invalida o portao.
      - id: playwright-version
        run: echo "version=$(node -p "require('./package-lock.json').packages['node_modules/playwright'].version")" >> "$GITHUB_OUTPUT"

      # Mesma FORMA de chave, com o conjunto de motores no fim. Uma chave
      # literalmente igual a do job `test` seria pior que duplicar: quem
      # terminasse primeiro gravaria a entrada, e se fosse este job o `test`
      # restauraria um cache so com Chromium e baixaria Firefox e WebKit em toda
      # execucao dali em diante, sem nunca poder regravar a chave ja ocupada.
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-ms-playwright-${{ steps.playwright-version.outputs.version }}-chromium

      # So Chromium, de proposito: o Playwright suporta service worker apenas
      # nesse motor, entao instalar os outros dois aqui custaria minutos e nao
      # compraria cobertura -- produziria dois projetos verdes que nunca
      # registraram um worker. A lacuna que isso deixa (Firefox, WebKit e
      # iOS/Safari fisico) e decisao registrada de D2-11 e esta escrita em
      # docs/PARIDADE.md; nao e efeito colateral deste passo.
      - run: npx playwright install --with-deps chromium

      # A ordem e obrigatoria. O build produz o dist/ que as specs servem; o
      # passo do meio recusa um dist/ cujo worker ficou com as sentinelas de pe
      # (o caso de alguem rodar `vite build` solto), o que faria as quatro specs
      # falharem por um motivo que nao e o delas.
      - run: npm run build
      - run: npm run sw:verify
      # O script dos DOIS projetos, e nao mais so o do PWA. O segundo deles
      # (`net`) e a prova de ponta a ponta da sala — dois contextos
      # de navegador que abrem uma sala por loopback, se veem, escolhem classe e
      # comecam a run com o mesmo hash do tick 0 (SALA-02, SALA-03, D3-05). Os
      # dois projetos vivem no mesmo job porque compartilham exatamente o que
      # este job ja paga: o build, o Chromium do cache e a serializacao.
      - run: npm run test:e2e

  # THIS JOB PUBLISHES AN IMAGE. IT DOES NOT DEPLOY, AND THE DIFFERENCE IS A
  # DECISION RATHER THAN AN OMISSION (D2-32).
  #
  # It lives HERE, in the same file, because `needs:` only references jobs of
  # the SAME workflow: chaining a second file would require `on: workflow_run:`,
  # which is another trigger, another checkout, and which reads the workflow
  # file from the default branch instead of from the commit (DM-4). That is why
  # the old deploy.yml was deleted in plan 02-01 rather than chained -- it also
  # duplicated lint/test/build on Node 20, against the 24 here, and ran none of
  # the expensive gates.
  #
  # The two artifacts are DOWNLOADED, never rebuilt: that is the literal
  # translation of D2-05, preserved by D2-23, and it means what reaches the box
  # is byte for byte what cleared the cross-engine gate -- which cost the whole
  # of phase 1. A multi-stage Dockerfile running the build inside the image
  # would be shorter to write and would annul that phase entirely.
  #
  # NO THIRD-PARTY ACTION RUNS HERE, AND THAT IS THE GAIN RATHER THAN THE
  # OBSTACLE (T-2-SC, DM-8). The hosted runner already ships `docker` and
  # `buildx`, so login, build and push as `run:` steps do the entire job and
  # leave the gate in tests/workflows.test.ts INTACT. The alternative -- the two
  # Docker actions, both measured as node24 and therefore otherwise eligible --
  # would have required loosening the assertion that refuses every `uses:`
  # outside actions/, which is trading a gate for convenience in the one
  # pipeline of this project that writes outside the repository.
  #
  # THERE IS NO DEPLOY TRIGGER STEP, AND THE ABSENCE IS WRITTEN DOWN INSTEAD OF
  # DISCOVERED (D2-32). Measured on 2026-09-09: the panel API on the box is not
  # reachable from the internet -- its two ports time out from outside, by a
  # deliberate lockdown belonging to the neighbouring project that operates that
  # host. The four ways out the phase research costed -- giving the panel a
  # hostname of its own, exposing only its deploy route through the proxy in
  # front, a timer on the box polling the registry, or a key pair with a fixed
  # `command=` -- ALL require changing the neighbour's configuration or
  # reintroducing the host-as-code that D2-22 exists to remove. None is done,
  # and this is a written deferral rather than accidental debt.
  #
  # So what a push to main buys is that THE IMAGE EXISTS IN THE REGISTRY.
  # Promotion is a person: the operator opens the tunnel, points the tag at the
  # sha and deploys, which is the `clique-painel` form plan 02-04 chose and
  # which section 5 of ops/README.md documents step by step. D2-08 is therefore
  # SUSPENDED in its deploy half for this phase and holds in its image half.
  #
  # NO DEPLOY SECRET EXISTS, AND NONE EVER DID. The four that the original plan
  # 02-04 asked for -- a private key, a host, a user and a pinned host key --
  # were never created, and neither was the single hook secret of the revoked
  # D2-31. This is removal of TEXT, not revocation of a credential, so nobody
  # should go hunting for them in the repository settings and find an empty list
  # confusing. The one credential this job reads is the GITHUB_TOKEN the runner
  # injects, which is ephemeral by construction.
  #
  # THE REPOSITORY VARIABLE THAT USED TO GATE THIS JOB DIES HERE, AND THAT
  # CONTRADICTS AN EXPLICIT RECOMMENDATION OF THE PHASE RESEARCH -- so the
  # reasoning is written where the next person will look for it. The variable
  # existed because the job it gated FAILED for want of a secret, and a job that
  # stays red for weeks teaches everybody to stop reading red CI. This job
  # cannot fail that way: its only credential is the token the runner always
  # provides. Keeping an `if:` that nobody can satisfy would reintroduce the
  # same defect from the other side -- a job SKIPPED forever, which is precisely
  # the case that the variable's own comment called worse than red.
  #
  # Its name, like the names of the four secrets above, is deliberately NOT
  # spelled anywhere in this file -- the same device the `permissions:` comment
  # at column zero uses for the broad token value. The point is that a grep of
  # this workflow for any of the five comes back EMPTY, and that emptiness is
  # the cheapest available proof that no path here reaches the box. A comment
  # that named them would make the proof impossible in order to be tidy.
  image:
    needs: [test, pwa]
    # D2-08 applied to the IMAGE and not to the deploy (D2-32): every push to
    # main that clears both gates puts an image in the registry, and nothing
    # else puts one there. Two clauses and deliberately nothing else -- there is
    # no repository variable left to gate on, which is the paragraph above
    # written as an absence.
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    # WR-18. The default job limit is SIX HOURS, and with cancellation switched
    # off in the group below that limit stops being merely wasteful: a hung
    # transfer holds the group for all of it, and every later publication
    # queues behind it -- including the one that would fix whatever is hung. The
    # steps here are a checkout, two artifact downloads and four Docker
    # commands; 15 minutes is wide for them and short enough that hanging is a
    # fifteen-minute incident rather than a whole shift.
    timeout-minutes: 15
    # T-2-RACE: two publications must never run at once. Cancellation stays off
    # on purpose -- interrupting a push halfway leaves partial layers in the
    # registry, and the middle of a transfer is still the one point of the
    # process that cannot be repeated over without thinking. The group is named
    # for what it protects NOW: the registry, and no longer the release symlink
    # of a machine that does not exist.
    concurrency:
      group: publish-image
      cancel-in-progress: false
    # THE ONLY WRITE OF THE ENTIRE WORKFLOW, and it is named rather than broad.
    # `packages: write` is what pushing to the registry with the GITHUB_TOKEN
    # requires, and that token is the EPHEMERAL JOB TOKEN: minted when the job
    # starts, dead when it ends, scoped to this repository. The alternative is a
    # classic personal access token carrying package-write scope, stored in a
    # secret -- a long-lived credential in a third-party service, which is
    # strictly worse (T-2-TOKEN). A job-level block REPLACES the workflow one,
    # so raising the floor at column zero one day does not raise this ceiling
    # with it.
    permissions:
      contents: read
      packages: write
    steps:
      # This job DOES check out, unlike the one it replaces: both Dockerfiles
      # and the Caddyfile they copy are read from the tree.
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - uses: actions/download-artifact@v8
        with:
          name: server
          path: dist-server

      # The token arrives through `env:` and reaches the command through STDIN,
      # never through argv (T-2-CREDLOG): a secret on a command line shows up in
      # the process table of the runner and in any log that echoes the command.
      # `$GITHUB_ACTOR` is a default variable of the runner, used instead of a
      # `${{ }}` expansion so that no template value is ever pasted into a shell
      # string here -- the same reasoning that kept machine and user names in an
      # `env:` block in the job this one replaces.
      - name: Login no registro de imagens
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          printf '%s' "$REGISTRY_TOKEN" \
            | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      # THE TAG IS THE COMMIT SHA AND NEVER A MOVING NAME (T-2-MOVTAG). A moving
      # tag destroys the rollback of D2-24, because there is no "previous image"
      # once the previous name points at the new content -- and, worse, "the
      # image I reviewed" and "the image that is running" become one label with
      # two contents. The known improvement, registered in ops/README.md rather
      # than discovered later, is pinning by digest instead of by tag.
      #
      # THE OWNER IS FORCED TO LOWER CASE, and this is the kind of defect that
      # only appears on the first real push: the registry refuses a repository
      # path containing an upper-case letter, and this project's repository name
      # has two of them. The owner comes from a default variable of the runner
      # for the same reason the login above uses one.
      #
      # The two image names are literals, and they are the same two that
      # ops/docker-compose.yml pulls. Two copies of a value that must agree are
      # one edit away from not agreeing, and the symptom here would be a deploy
      # pulling a name nobody pushed -- so tests/workflows.test.ts compares the
      # two files against each other instead of each against a literal.
      #
      # The build context is the repository ROOT, with `-f` pointing into ops/,
      # because both Dockerfiles copy dist/, dist-server/, ops/ and the
      # manifests.
      - name: Construir e empurrar as duas imagens
        run: |
          set -eu
          owner=$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          registry="ghcr.io/$owner"
          docker build -f ops/Dockerfile.web -t "$registry/dg2-web:$GITHUB_SHA" .
          docker build -f ops/Dockerfile.api -t "$registry/dg2-api:$GITHUB_SHA" .
          docker push "$registry/dg2-web:$GITHUB_SHA"
          docker push "$registry/dg2-api:$GITHUB_SHA"
