name: CI

on:
  pull_request:
  push:

# O PISO, e ele e do workflow inteiro (WR-19). Um `permissions:` dentro de um
# job governa aquele job e mais nada, entao `test` e `pwa` -- que nao
# declaravam nenhum -- herdavam o padrao do REPOSITORIO. Esse padrao concede
# ESCRITA em todos os escopos em qualquer repositorio ou organizacao criado
# antes da mudanca de 2023, e o repositorio deste projeto ainda nem existe: e
# desconhecido por construcao, o que e o mesmo que amplo. (A grafia literal
# desse valor nao aparece aqui de proposito: tests/workflows.test.ts a recusa
# como substring, sem isentar comentario, pelo mesmo motivo pelo qual recusa a
# descoberta de chave de host mais abaixo -- a hora em que alguem escreveria a
# linha e a hora em que um job esta vermelho e o caminho curto parece
# razoavel.) O resultado era o token largo justamente nos dois jobs que rodam a
# toolchain inteira e baixam tres motores de browser, e o token estreito no
# unico que nao faz checkout.
#
# `contents: read` e o que o CI de fato precisa: `actions/checkout` le a
# arvore, e nenhum passo escreve no repositorio. Os artefatos entre jobs sao do
# `actions/upload-artifact`, que usa um token proprio do runner e nao este.
#
# O bloco do job `deploy` fica onde esta de proposito. Ele nao e redundante com
# este: um `permissions:` de job SUBSTITUI o do workflow, entao mante-lo e o
# que garante que subir o piso daqui um dia nao suba junto o teto do unico job
# que carrega uma chave privada de escrita na VPS.
permissions:
  contents: read

# As cinco acoes NAO estao todas no mesmo major, e isso e a correcao, nao
# desleixo. Ate aqui o arquivo inteiro dizia @v4 e o runner anotava toda
# execucao: "Node.js 20 is deprecated. The following actions target Node.js 20
# but are being forced to run on Node.js 24". Forcado nao e suportado -- quem
# publica a acao nunca exercitou as dependencias vendorizadas dela contra o 24
# -- entao a anotacao e o runner avisando que esta chutando por nos, dentro da
# esteira que carrega a chave de deploy.
#
# Cada acao atravessa para node24 num major diferente. O primeiro numero e
# aquele em que o `runs.using` do action.yml dela deixa de dizer node20; o
# segundo e onde este arquivo esta, que e o ultimo major publicado:
#
#   checkout           node24 a partir da v5    -> aqui na v7
#   setup-node         node24 a partir da v5    -> aqui na v7
#   cache              node24 a partir da v5    -> aqui na v6
#   upload-artifact    node24 a partir da v6    -> aqui na v7
#   download-artifact  node24 a partir da v7    -> aqui na v8
#
# A ARMADILHA, escrita porque nao da para adivinhar: subir tudo para a v5
# PARECE a correcao e deixa a anotacao exatamente onde estava. A v5 do
# upload-artifact e a v5 e a v6 do download-artifact ainda declaram node20 --
# sao node20 usando um numero mais novo. E esses dois sao justamente o par que
# leva os bytes publicaveis do job `test` ao job `deploy`, que e D2-05.
#
# Por que o ultimo major de cada, e nao o minimo que cala o aviso: em CI uma
# quebra e vermelha e imediata, ao contrario de um defeito de producao, e parar
# dois majors atras so reagenda este mesmo trabalho para daqui a pouco.
# tests/workflows.test.ts recusa qualquer major sabidamente node20, por tabela
# e sem rede -- entao o proximo a mexer aqui nao precisa confiar nesta lista.
#
# O que foi conferido nas notas de cada major atravessado, e nao presumido:
#
#   setup-node   a v5 ligou cache automatico e a v6 o limitou a npm. Nada disso
#                nos alcanca: ele so liga quando ha `packageManager` ou
#                `devEngines.packageManager` no package.json, e nao ha nenhum
#                dos dois. O `cache: npm` explicito abaixo continua sendo um
#                valor suportado na v7 (npm, yarn, pnpm), que e do que este
#                workflow depende.
#   cache        a semantica de chave e a MESMA na v6: chave ja existente nao e
#                regravada, so restaurada. E exatamente dela que depende o
#                sufixo `-chromium` da chave do job `pwa`, mais abaixo. A v6
#                acrescentou uma melhora que nao nos custa nada: quando o token
#                de cache e so de leitura, o passo de gravacao avisa em vez de
#                falhar o job.
#   checkout     a v6 passou a guardar a credencial num arquivo separado, e a
#                v7 passou a recusar checkout de PR de fork em
#                `pull_request_target` e `workflow_run`. Nenhum passo daqui usa
#                o token do checkout depois dele, e os gatilhos deste arquivo
#                sao `pull_request` e `push` -- os dois eventos citados nao
#                existem aqui.
#   artefatos    o par v7/v8 saiu no mesmo dia e e um par de proposito. A v7 do
#                upload ganhou envio de arquivo solto (`archive: false`), que
#                NAO usamos -- o padrao segue zipando, que e o que o job
#                `deploy` espera. A v8 do download deixou de tentar
#                descompactar tudo e passou a olhar o Content-Type antes, o que
#                casa com o zip que a v7 produz. A v8 tambem passou a ERRAR
#                quando o digest baixado nao bate com o do servidor, onde antes
#                so avisava: e o padrao certo para o unico job que copia bytes
#                para a caixa. Baixar por `name:`, que e o que fazemos, nao foi
#                tocado pela quebra da v5 do download -- ela mudou o caminho de
#                saida de quem baixa por `artifact-ids:`.

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - run: npm ci
      - run: npm run lint
      # segunda guarda de pureza de packages/sim (D-16): lib sem DOM e types vazio,
      # entao o proprio compilador recusa window/document dentro do pacote
      - run: npm run typecheck:sim
      - run: npm run typecheck:protocol
      # apps/ NAO esta no include do tsconfig da raiz, entao o `tsc --noEmit` do
      # build nao ve uma linha de apps/server: sem este passo o servidor viajaria
      # ate a VPS sem nenhuma checagem de tipos. Ele tambem e o unico lugar onde
      # tests/server-migrate.test.ts e tests/server-health.test.ts sao compilados,
      # porque a raiz os exclui por precisarem de tipos de Node.
      - run: npm run typecheck:server
      - run: npm test

      # FORM-03: prova que o SIM_VERSION e reproduzivel (dois builds da mesma
      # fonte dao o mesmo valor) e sensivel (editar packages/sim/src muda o
      # valor). Roda aqui, e nao so no build final, para que a perda de
      # reprodutibilidade apareca no proprio PR que a causou -- tipicamente um
      # upgrade de Vite ou de TypeScript, que por D-07 fecha a temporada.
      - run: npm run sim:version:verify

      # FORM-09: a spec de assets so vale se a recusa for executavel. Os tres
      # passos rodam DEPOIS de sim:version:verify porque ele termina reconstruindo
      # packages/sim/dist/sim.js, que e de onde as hitboxes de ENEMY_DEFS sao
      # lidas -- o validador recusa a rodar sem ele.
      #   selftest  prova a aceitacao (fixtures/good, com o caso de hitbox maior
      #             que o sprite que so a tolerancia por entrada admite)
      #   refusal   prova que o manifesto quebrado NAO passa, e que a recusa
      #             aponta os tres defeitos por nome -- criterio de sucesso 5 da
      #             fase. Um portao que so testa aceitacao nao testa nada
      #   validate  roda contra public/assets, que e por onde a arte de verdade
      #             chega: PR de outro repositorio, sem revisao humana antes do
      #             CI (T-1-04). Hoje o diretorio nao tem manifesto e o passo e
      #             verde por vacuidade; ele existe para ja estar aqui no dia em
      #             que o primeiro lote chegar
      - run: npm run assets:selftest
      - run: npm run assets:refusal
      - run: npm run assets:validate

      # A versao exata do Playwright e a variavel do experimento de determinismo:
      # um cache compartilhado entre versoes diferentes invalida o portao.
      - id: playwright-version
        run: echo "version=$(node -p "require('./package-lock.json').packages['node_modules/playwright'].version")" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-ms-playwright-${{ steps.playwright-version.outputs.version }}

      - run: npx playwright install --with-deps chromium firefox webkit

      # FORM-04, criterio de sucesso 1 da fase: os quatro motores (Node, acima,
      # mais estes tres) tem de produzir o MESMO hashWorld na run de ouro.
      # Bloqueante desde o plano 01-12, que trocou a trigonometria do motor
      # pelo port fdlibm de sim/math.ts e virou este passo de vermelho para
      # verde. Se ele voltar a falhar, algum caminho de sim/ voltou a depender
      # de aritmetica que a spec so aproxima -- e o sintoma alternativo seria
      # uma sessao co-op dessincronizando na fase 4, onde diagnosticar custa
      # dez vezes mais.
      - run: npm run test:browser

      - run: npm run build

      # O portao do worker roda AQUI tambem, e nao so no job `pwa`, porque quem
      # sobe o artefato publicavel e este job: sem ele, o dist/ que viaja para a
      # caixa poderia ser um dist/ cujo sw.js ficou com as sentinelas de pe --
      # alguem rodou `vite build` solto -- e o service worker publicado
      # precacharia nada. E um defeito que so aparece offline, semanas depois,
      # e sem nada para correlacionar. O job `pwa` mantem o dele porque protege
      # outra coisa: o dist/ que as specs de Playwright servem.
      - run: npm run sw:verify

      # O bundle do servidor entra no mesmo par de artefatos para que cliente e
      # servidor publicados venham do MESMO commit e do MESMO job. O script de
      # release na caixa compara o sha256 deste arquivo para decidir se
      # reinicia a unit, entao os dois lados do release chegam juntos.
      - run: npm run server:build

      # D2-05 escrito como bytes. O job de publicacao baixa EXATAMENTE estes
      # dois artefatos, entao o que chega na caixa e o que passou pelo portao
      # cross-engine (test:browser) e pelo portao do worker acima -- nunca um
      # segundo build que por acaso deu no mesmo. Reconstruir no outro job seria
      # mais barato de escrever e erraria justamente no dia em que o build
      # deixasse de ser reproduzivel, que e o dia em que ninguem esta olhando.
      # retention-days: 7 porque o artefato so precisa sobreviver ao job
      # seguinte, e reter menos e menos superficie.
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist
          retention-days: 7

      - uses: actions/upload-artifact@v7
        with:
          name: server
          path: dist-server
          retention-days: 7

  # A prova executavel de INFRA-02 e INFRA-03. Se este job ficar vermelho, uma
  # de tres coisas aconteceu: o precache deixou de cobrir o dist/, uma resposta
  # de /api/ passou a ser guardada em Cache Storage, ou a atualizacao a partir
  # de uma instalacao antiga parou de funcionar. Nenhuma das tres aparece em
  # outro portao, e nenhuma das tres da sintoma antes de um jogador abrir o jogo
  # sem rede -- semanas depois, sem nada para correlacionar.
  #
  # Independente do job `test` (sem `needs:`) porque os dois nao compartilham
  # artefato nenhum: serializar so somaria minutos ao PR. O job `deploy` do
  # plano 02-11 e que vai declarar `needs: [test, pwa]`, e e la que a
  # dependencia pertence -- publicar e o unico passo que precisa dos dois.
  pwa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      # O mesmo par de passos do job `test`, e pelo mesmo motivo: a versao exata
      # do Playwright e a variavel do experimento, entao um cache compartilhado
      # entre versoes diferentes invalida o portao.
      - id: playwright-version
        run: echo "version=$(node -p "require('./package-lock.json').packages['node_modules/playwright'].version")" >> "$GITHUB_OUTPUT"

      # Mesma FORMA de chave, com o conjunto de motores no fim. Uma chave
      # literalmente igual a do job `test` seria pior que duplicar: quem
      # terminasse primeiro gravaria a entrada, e se fosse este job o `test`
      # restauraria um cache so com Chromium e baixaria Firefox e WebKit em toda
      # execucao dali em diante, sem nunca poder regravar a chave ja ocupada.
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-ms-playwright-${{ steps.playwright-version.outputs.version }}-chromium

      # So Chromium, de proposito: o Playwright suporta service worker apenas
      # nesse motor, entao instalar os outros dois aqui custaria minutos e nao
      # compraria cobertura -- produziria dois projetos verdes que nunca
      # registraram um worker. A lacuna que isso deixa (Firefox, WebKit e
      # iOS/Safari fisico) e decisao registrada de D2-11 e esta escrita em
      # docs/PARIDADE.md; nao e efeito colateral deste passo.
      - run: npx playwright install --with-deps chromium

      # A ordem e obrigatoria. O build produz o dist/ que as specs servem; o
      # passo do meio recusa um dist/ cujo worker ficou com as sentinelas de pe
      # (o caso de alguem rodar `vite build` solto), o que faria as quatro specs
      # falharem por um motivo que nao e o delas.
      - run: npm run build
      - run: npm run sw:verify
      - run: npm run test:pwa

  # Publicar e `git push` na main, e este job e todo o caminho.
  #
  # Ele vive AQUI, no mesmo arquivo, porque `needs:` so referencia jobs do
  # MESMO workflow: encadear um segundo arquivo exigiria `on: workflow_run:`,
  # que e outro gatilho, outro checkout, e le o arquivo de workflow da branch
  # padrao em vez do commit (DM-4). Foi por isso que o deploy.yml antigo foi
  # apagado no plano 02-01 em vez de encadeado -- ele ainda por cima duplicava
  # lint/test/build em Node 20, contra os 24 daqui, e nao rodava nenhum dos
  # portoes caros.
  #
  # Os dois artefatos sao BAIXADOS, nunca reconstruidos: e a traducao literal de
  # D2-05 -- o que chega na caixa e byte a byte o que passou pelo portao
  # cross-engine, que custou a fase 1 inteira.
  #
  # NADA aqui ja rodou contra a caixa. Os quatro secrets e a variavel de
  # repositorio que liga este job sao criados no plano 02-04, e a primeira
  # execucao real e o plano 02-12. Ate la o job e PULADO, nao vermelho -- o
  # `if:` logo abaixo explica por que a diferenca importa.
  deploy:
    needs: [test, pwa]
    # D2-08: todo push na main que passar no CI publica, e nada mais publica.
    # E isso que torna a reversao compreensivel, porque o symlink anterior
    # corresponde exatamente ao commit anterior -- nao ha um segundo caminho
    # capaz de por bytes na caixa e desalinhar os dois.
    #
    # A terceira clausula nao abre um segundo caminho: ela nao escolhe QUAL
    # commit publica, so diz se ha alvo para onde publicar. Sem ela este job
    # rodava em TODO push na main e morria na guarda de segredo vazio do
    # primeiro passo, porque o plano 02-04 -- o que cria os secrets e a caixa
    # -- esta adiado. Medido na primeira execucao real deste workflow: `test`
    # verde, `pwa` verde, `deploy` vermelho. Um job vermelho por semanas ensina
    # todo mundo a nao ler CI vermelho, que e o contrario do que este portao
    # existe para comprar.
    #
    # Por que uma VARIAVEL de repositorio, e nao a presenca de um secret: os
    # contextos que um `if:` de JOB enxerga sao github, needs, vars e inputs.
    # `secrets` nao esta entre eles, e uma condicao que tentasse ler um nao
    # daria erro -- avaliaria para nada, nunca ficaria verdadeira, e o job
    # deixaria de rodar em silencio. Trocar um job vermelho por um job que some
    # sem avisar e piorar. tests/workflows.test.ts recusa as duas metades.
    #
    # Pular ANTES de configurar e o certo; pular DEPOIS seria a armadilha, e o
    # que separa os dois casos e a variavel ser propriedade do REPOSITORIO e
    # nao do commit: nenhum PR, merge ou revert alcanca ela. Ela vira `true`
    # uma unica vez, pela mao do operador, no mesmo ato que cria os quatro
    # secrets (plano 02-04; a lista completa esta na secao 5 de ops/README.md).
    # Dali em diante a condicao vale para todo push na main que passar no CI,
    # que e literalmente D2-08. O unico jeito de ela voltar a ser falsa e
    # alguem apagar a variavel nas configuracoes, que e o mesmo ato de
    # aposentar a caixa.
    #
    # As guardas `:?` do primeiro passo FICAM, e nao sao redundantes com isto:
    # a variavel diz que o alvo foi configurado, elas dizem que o valor chegou.
    # Um secret criado e vazio passa por aqui e e recusado la, pelo nome, antes
    # de qualquer conexao.
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    # WR-18. O limite padrao de um job sao SEIS HORAS, e com o
    # cancel-in-progress: false logo abaixo esse limite deixa de ser so
    # desperdicio: um rsync ou um ssh pendurado segura o grupo `deploy-vps` por
    # todo esse tempo, e todo deploy seguinte fica na fila atras dele --
    # inclusive o que corrigiria aquilo que travou. Os passos deste job sao
    # dois downloads de artefato e tres comandos de rede; 15 minutos e folga
    # larga para eles e curto o suficiente para que travar seja um incidente de
    # quinze minutos e nao de um turno inteiro.
    timeout-minutes: 15
    # T-2-RACE: dois deploys nunca podem correr sobre o mesmo symlink. O
    # cancelamento fica desligado de proposito -- interromper um deploy no meio
    # deixaria um release parcial em disco, e o meio de uma transferencia e o
    # unico ponto do processo que nao da para repetir por cima sem pensar.
    concurrency:
      group: deploy-vps
      cancel-in-progress: false
    # O token da propria GitHub nao tem o que fazer neste job: ele nao faz
    # checkout e nao escreve no repositorio. Reduzi-lo e reduzir o alcance da
    # unica esteira do projeto que carrega uma chave privada de escrita na VPS.
    permissions:
      contents: read
    env:
      # Nome de maquina e de usuario NUNCA entram no repositorio (D2-15) -- o
      # repositorio publico nao diz onde a maquina mora. Eles chegam por `env:`,
      # e nao interpolados dentro do `run:`, que e tambem o que mantem um valor
      # multilinha (a chave privada, abaixo) longe das aspas do shell.
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - uses: actions/download-artifact@v8
        with:
          name: server
          path: dist-server

      # A chave de host vem FIXADA de um secret, capturada uma vez de maquina
      # confiavel no plano 02-04. Descobri-la aqui dentro seria confiar no
      # primeiro que responder, dentro do unico pipeline que carrega a chave
      # privada de deploy -- e fixar custa uma linha. O teste em
      # tests/workflows.test.ts recusa a alternativa pelo nome, inclusive em
      # comentario, porque a hora em que alguem a escreveria e a hora em que um
      # deploy esta vermelho e o caminho curto parece razoavel.
      - name: Chave de deploy e known_hosts
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          # Um secret ausente chega como string vazia, e o sintoma seria um
          # "Permission denied (publickey)" trinta segundos depois, no meio de
          # uma transferencia. Falhar aqui, com o nome do secret, custa quatro
          # linhas e e a diferenca entre um erro e uma investigacao.
          : "${DEPLOY_SSH_KEY:?secret DEPLOY_SSH_KEY vazio ou ausente}"
          : "${DEPLOY_KNOWN_HOSTS:?secret DEPLOY_KNOWN_HOSTS vazio ou ausente}"
          : "${DEPLOY_USER:?secret DEPLOY_USER vazio ou ausente}"
          : "${DEPLOY_HOST:?secret DEPLOY_HOST vazio ou ausente}"

          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"

          # O umask vem ANTES da escrita, e a ordem e a correcao inteira
          # (WR-18). Um `>` cria o arquivo com o umask do processo, 0022 na
          # imagem do runner, entao a chave privada nasce 0644 e so o `chmod`
          # seguinte a fecha: existe uma janela, curta, em que ela esta
          # legivel para todos os usuarios da maquina. Numa maquina efemera da
          # propria GitHub isso e pequeno; num runner auto-hospedado, que e
          # para onde este job iria se o CI crescer, nao e. E o raciocinio que
          # justificou fixar a chave de host ("fixar custa uma linha") vale
          # aqui igual, pelo mesmo preco.
          #
          # O subshell existe para que o umask nao vaze para os passos
          # seguintes -- `umask` e propriedade do shell, e o `run:` inteiro e
          # um shell so.
          ( umask 077; printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/id_ed25519" )
          ( umask 077; printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts" )

          # Os chmod ficam, e nao sao redundantes com o umask acima: o umask so
          # age na CRIACAO, e `>` sobre um arquivo que ja existe trunca sem
          # tocar no modo. Num runner efemero nada existe antes; num
          # auto-hospedado, um $HOME/.ssh/id_ed25519 deixado por outra coisa
          # manteria o proprio modo. Duas linhas para cobrir os dois casos.
          chmod 600 "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/known_hosts"

      # --link-dest com caminho ABSOLUTO. O rsync resolve um --link-dest
      # relativo a partir do DESTINO, entao um `../current` funciona por
      # acidente em alguns layouts e falha em outros sem dizer nada -- so sem
      # hardlink, e o sintoma e disco cheio meses depois, sem nada que aponte
      # para aqui (P-12).
      #
      # $HOME e nao `~`: dentro de aspas duplas o shell NAO expande o til, e o
      # -e do rsync e entregue ao exec sem passar por shell nenhum.
      #
      # $GITHUB_SHA e o mesmo valor de github.sha e, num evento de push, e o
      # commit publicado: 40 hexadecimais minusculos, que e a unica forma de
      # argumento que o command= da chave aceita. A forma e fronteira de
      # seguranca, nao estilo -- o argumento vira caminho na caixa.
      # IdentitiesOnly=yes acompanha o -i em toda invocacao (WR-18). Sem ele o
      # ssh oferece PRIMEIRO tudo o que houver num agente e so depois a chave
      # do -i, e um agente com meia duzia de identidades esgota o MaxAuthTries
      # do servidor antes de chegar nela. O sintoma e `Permission denied
      # (publickey)` com a chave certa parada no diretorio, que e exatamente a
      # confusao que o passo acima diz existir para evitar, entrando por outra
      # porta. Hoje nao ha agente nenhum no runner hospedado; este e o pipeline
      # errado para deixar dependendo disso.
      - name: Enviar o release do cliente
        run: |
          rsync -az --delete \
            -e "ssh -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes -i $HOME/.ssh/id_ed25519" \
            --link-dest=/srv/dg2/current/ \
            dist/ "$DEPLOY_USER@$DEPLOY_HOST:/srv/dg2/releases/$GITHUB_SHA/"

      - name: Enviar o release do servidor
        run: |
          rsync -az --delete \
            -e "ssh -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes -i $HOME/.ssh/id_ed25519" \
            --link-dest=/srv/dg2/current-server/ \
            dist-server/ "$DEPLOY_USER@$DEPLOY_HOST:/srv/dg2/server-releases/$GITHUB_SHA/"

      # A partir daqui quem decide e a caixa: a troca atomica dos dois symlinks
      # por rename(2), o restart condicional da unit -- so quando o sha256 do
      # bundle mudou, porque o restart re-executa a migracao e essa e a unica
      # parte do deploy capaz de falhar -- e a poda dos releases antigos.
      - name: Ativar o release
        run: |
          ssh -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes -i "$HOME/.ssh/id_ed25519" \
            "$DEPLOY_USER@$DEPLOY_HOST" "/srv/dg2/bin/deploy.sh $GITHUB_SHA"

      # `if: always()` e nao um ultimo passo qualquer: um passo sem condicao e
      # PULADO assim que algum anterior falha, ou seja, a limpeza rodaria
      # justamente nas execucoes em que nada deu errado e seria pulada nas
      # outras -- e a execucao que falhou no meio de um `ssh` e a que tem mais
      # chance de deixar a maquina em estado inesperado.
      #
      # Num runner hospedado a maquina inteira e destruida depois do job e isto
      # nao muda nada. O passo existe para o dia em que este job rodar num
      # runner auto-hospedado, quando $HOME sobrevive ao job e a chave ficaria
      # em disco esperando o proximo processo que resolvesse ler.
      - name: Apagar a chave de deploy
        if: always()
        run: rm -f "$HOME/.ssh/id_ed25519"
